name: CP Colonel POS 6.5

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true
      - name: Generate Android platform files
        working-directory: app
        run: flutter create --platforms android .
      - name: Set Android app label
        working-directory: app
        run: sed -i 's/android:label="[^"]*"/android:label="CP Colonel POS"/' android/app/src/main/AndroidManifest.xml
      - name: Get dependencies
        working-directory: app
        run: flutter pub get
      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons
      - name: Analyze
        working-directory: app
        run: dart analyze lib
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cp-colonel-pos-6.5-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
