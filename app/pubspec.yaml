name: colonel_pos_65
description: CP Colonel POS 6.5 — aplikasi point of sale restoran.
publish_to: "none"
version: 6.5.0+2

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  print_bluetooth_thermal: ^1.2.4
  esc_pos_utils_plus: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/cp_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/cp_logo.png
